[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-intelligence-backend"
version = "0.1.0"
description = "FastAPI Backend for AI Trading Intelligence Multi-Market SaaS Platform (Signals-Only)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.5",
    "pydantic-settings==2.7.1",
    "sqlalchemy==2.0.37",
    "alembic==1.14.1",
    "psycopg[binary]==3.2.4",
    "redis==5.2.1",
    "celery==5.4.0",
    "argon2-cffi==23.1.0",
    "cryptography==44.0.0",
    "httpx==0.28.1",
    "python-multipart==0.0.20",
    "pypdf==5.1.0",
    "stripe==11.4.1",
    "razorpay==1.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "ruff==0.9.2",
    "mypy==1.14.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["..", "../backend", "../trading-engine"]

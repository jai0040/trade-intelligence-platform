name: trade-intelligence-platform

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trade_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-tip_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_local_change_me}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tip_app} -d ${POSTGRES_DB:-trade_intelligence}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tip_app}:${POSTGRES_PASSWORD:-dev_local_change_me}@postgres:5432/${POSTGRES_DB:-trade_intelligence}
      REDIS_URL: redis://valkey:6379/0
      CELERY_BROKER_URL: redis://valkey:6379/1
      CELERY_RESULT_BACKEND: redis://valkey:6379/2
      TRADING_MODE: SIGNALS_ONLY
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - internal
      - edge

  celery-worker:
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tip_app}:${POSTGRES_PASSWORD:-dev_local_change_me}@postgres:5432/${POSTGRES_DB:-trade_intelligence}
      REDIS_URL: redis://valkey:6379/0
      CELERY_BROKER_URL: redis://valkey:6379/1
      CELERY_RESULT_BACKEND: redis://valkey:6379/2
      TRADING_MODE: SIGNALS_ONLY
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - internal

  celery-beat:
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    command: ["celery", "-A", "scheduler.celery_app:celery_app", "beat", "-l", "info"]
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tip_app}:${POSTGRES_PASSWORD:-dev_local_change_me}@postgres:5432/${POSTGRES_DB:-trade_intelligence}
      REDIS_URL: redis://valkey:6379/0
      CELERY_BROKER_URL: redis://valkey:6379/1
      CELERY_RESULT_BACKEND: redis://valkey:6379/2
      TRADING_MODE: SIGNALS_ONLY
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - internal

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws/v1/stream
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    networks:
      - edge

volumes:
  pg_data:
  valkey_data:

networks:
  internal:
    internal: true
  edge:

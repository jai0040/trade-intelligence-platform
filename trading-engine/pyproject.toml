[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-intelligence-engine"
version = "0.1.0"
description = "Multi-market deterministic trading intelligence engine & Celery worker suite (Signals-Only)"
requires-python = ">=3.12"
dependencies = [
    "celery==5.4.0",
    "redis==5.2.1",
    "sqlalchemy==2.0.37",
    "psycopg[binary]==3.2.4",
    "pydantic==2.10.5",
    "httpx==0.28.1",
    "pypdf==5.1.0",
]

[tool.setuptools.packages.find]
include = [
    "domain*",
    "adapters*",
    "data_providers*",
    "skill_wrappers*",
    "signal_engine*",
    "risk_engine*",
    "ai_analyst*",
    "scheduler*",
    "workflows*",
]
